<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070b24">
  <title>Maintenance en cours — EAS 96</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      box-sizing: border-box;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 80% 55% at 50% -10%, rgba(0, 0, 145, 0.45), transparent 70%),
        radial-gradient(ellipse 60% 45% at 50% 115%, rgba(225, 0, 15, 0.14), transparent 70%),
        #070b24;
      color: #ffffff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Bande tricolore, comme en tête du site */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #000091 0 33.33%, #d5dbea 33.33% 66.66%, #e1000f 66.66% 100%);
    }
    main { max-width: 34rem; text-align: center; }
    .logo { display: block; width: auto; height: 52px; margin: 0 auto 36px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 6px 14px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
    h1 {
      margin: 22px 0 0;
      font-family: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.05;
      text-transform: uppercase;
    }
    .rule { width: 48px; height: 3px; margin: 18px auto 0; background: #e1000f; border-radius: 2px; }
    .lead { margin: 18px 0 0; color: rgba(255, 255, 255, 0.7); font-size: 1rem; line-height: 1.65; }
    .discord {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      padding: 14px 24px;
      border-radius: 10px;
      background: #5865f2;
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .discord:hover { background: #4752c4; transform: translateY(-1px); }
    .discord:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
    .discord svg { width: 22px; height: 22px; }
    .note { margin: 16px 0 0; color: rgba(255, 255, 255, 0.45); font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/img/logo-leger-blanc.png" alt="EAS 96 — Estuaire d'Armor Simulation" width="438" height="128">
    <p class="badge"><span class="dot" aria-hidden="true"></span>Maintenance en cours</p>
    <h1>Site actuellement en maintenance</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lead">Le site est temporairement indisponible. Pour toute information, référez-vous au Discord d'EAS 96.</p>

</html>
