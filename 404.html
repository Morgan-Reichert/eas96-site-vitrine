<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070b24">
  <title>404 · Page introuvable — EAS 96</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      box-sizing: border-box;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 80% 55% at 50% -10%, rgba(0, 0, 145, 0.45), transparent 70%),
        radial-gradient(ellipse 60% 45% at 50% 115%, rgba(225, 0, 15, 0.14), transparent 70%),
        #070b24;
      color: #ffffff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Bande tricolore, comme en tête du site */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #000091 0 33.33%, #d5dbea 33.33% 66.66%, #e1000f 66.66% 100%);
    }
    main { max-width: 32rem; text-align: center; }
    .logo { display: block; width: auto; height: 52px; margin: 0 auto 40px; }
    .code {
      margin: 0;
      color: transparent;
      font-family: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
      font-size: clamp(5.5rem, 22vw, 9rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 0.9;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.9);
    }
    @supports not (-webkit-text-stroke: 1px) {
      .code { color: #ffffff; }
    }
    h1 {
      margin: 20px 0 0;
      font-family: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .rule { width: 48px; height: 3px; margin: 16px auto 0; background: #e1000f; border-radius: 2px; }
    .lead { margin: 16px 0 0; color: rgba(255, 255, 255, 0.65); font-size: 0.95rem; line-height: 1.6; }
    .home {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 22px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .home:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.6); }
    .home:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/img/logo-leger-blanc.png" alt="EAS 96 — Estuaire d'Armor Simulation" width="438" height="128">
    <p class="code">404</p>
    <h1>Page introuvable</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lead">La page que vous cherchez n'existe pas ou n'est plus disponible.</p>
    <a class="home" href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
